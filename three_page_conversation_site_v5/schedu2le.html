<script>
document.getElementById('choiceLog').value=localStorage.getItem('conversation_choice_log')||'[]';
document.getElementById('scheduleForm').addEventListener('submit',function(e){
  e.preventDefault();
  const d=document.getElementById('date').value,t=document.getElementById('time').value;
  const pretty=d.split('-').reverse().join('/');
  const display=document.querySelector('#time option:checked').textContent;
  const submission={date_iso:d,date_display:pretty,time_24h:t,time_display:display,choice_log:document.getElementById('choiceLog').value};
  console.log('SUBMISSION',submission);
  document.getElementById('status').textContent='Got it — '+pretty+' at '+display+'! ♥';
});
</script>
