<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>So... when are you free?</title>

  <link rel="stylesheet" href="style.css">
</head>


<body>


  <!-- ==================================================
       SONG
       ================================================== -->

  <audio
    id="dateSong"
    preload="auto"
    playsinline
  ></audio>


  <!-- ==================================================
       HIDDEN IFRAME
       Google Apps Script receives the form here
       without leaving the page.
       ================================================== -->

  <iframe
    name="googleSheetFrame"
    id="googleSheetFrame"
    style="
      display: none;
      width: 0;
      height: 0;
      border: 0;
    "
  ></iframe>


  <!-- ==================================================
       FLOATING DOTS
       ================================================== -->

  <span class="spark s1"></span>
  <span class="spark s2"></span>
  <span class="spark s3"></span>
  <span class="spark s4"></span>
  <span class="spark s5"></span>
  <span class="spark s6"></span>
  <span class="spark s7"></span>
  <span class="spark s8"></span>
  <span class="spark s9"></span>
  <span class="spark s10"></span>
  <span class="spark s11"></span>
  <span class="spark s12"></span>
  <span class="spark s13"></span>
  <span class="spark s14"></span>
  <span class="spark s15"></span>
  <span class="spark s16"></span>
  <span class="spark s17"></span>
  <span class="spark s18"></span>


  <!-- ==================================================
       MAIN CARD
       ================================================== -->

  <main class="card transition-page">

    <div class="icon">
      📅🙂
    </div>


    <p class="eyebrow">
      Your call
    </p>


    <h1>
      So... when are you free? 🙂
    </h1>


    <p>
      Pick whatever works for you. 👍
    </p>


    <p class="meetup">
      <span>
        📍 Meet up in CCD
      </span>
    </p>


    <!-- ==================================================
         FORM
         ================================================== -->

    <form
      id="scheduleForm"
      action="https://script.google.com/macros/s/AKfycbxPEWcKfJzzWcIjgLwYVkNrt8DXCKx-jZE86_rFMmVnMxZHHQjuj5ia3RoiC5pNw0T5/exec"
      method="POST"
      target="googleSheetFrame"
    >


      <!-- ==================================================
           HIDDEN GOOGLE SHEET DATA
           ================================================== -->

      <input
        type="hidden"
        id="firstChoice"
        name="first_choice"
      >

      <input
        type="hidden"
        id="secondChoice"
        name="second_choice"
      >

      <input
        type="hidden"
        id="place"
        name="place"
        value="CCD"
      >

      <input
        type="hidden"
        id="choiceLog"
        name="choice_log"
      >

      <input
        type="hidden"
        id="timestamp"
        name="timestamp"
      >


      <!-- ==================================================
           DATE
           ================================================== -->

      <label for="date">
        Pick a Day 🙂
      </label>


      <input
        id="date"
        name="date"
        type="date"
        required
      >


      <!-- ==================================================
           TIME
           ================================================== -->

      <label for="time">
        What Time? 🕒
      </label>


      <select
        id="time"
        name="time"
        required
      >

        <option
          value=""
          selected
          disabled
        >
          Select a time...
        </option>

      </select>


      <!-- ==================================================
           SUBMIT BUTTON
           ================================================== -->

      <input
        id="setDateButton"
        type="submit"
        value="Set the date! 🙂"
      >

    </form>


    <p
      id="status"
      class="status"
      aria-live="polite"
    ></p>


  </main>


  <!-- ==================================================
       JAVASCRIPT
       ================================================== -->

  <script>


    /* ==================================================
       ELEMENTS
       ================================================== */

    const form =
      document.getElementById("scheduleForm");

    const dateSong =
      document.getElementById("dateSong");

    const submitButton =
      document.getElementById("setDateButton");

    const status =
      document.getElementById("status");

    const timeSelect =
      document.getElementById("time");


    /* ==================================================
       GOOGLE APPS SCRIPT URL
       ================================================== */

    const ENDPOINT_URL =
      "https://script.google.com/macros/s/AKfycbxPEWcKfJzzWcIjgLwYVkNrt8DXCKx-jZE86_rFMmVnMxZHHQjuj5ia3RoiC5pNw0T5/exec";


    /* ==================================================
       GENERATE TIME OPTIONS
       8:00 AM → 11:45 PM
       ================================================== */

    for (
      let minutes = 8 * 60;
      minutes <= 23 * 60 + 45;
      minutes += 15
    ) {

      const hour24 =
        Math.floor(minutes / 60);

      const minute =
        minutes % 60;

      let hour12 =
        hour24 % 12;

      if (hour12 === 0) {
        hour12 = 12;
      }

      const ampm =
        hour24 < 12
          ? "AM"
          : "PM";

      const value =
        String(hour24).padStart(2, "0") +
        ":" +
        String(minute).padStart(2, "0");

      const label =
        hour12 +
        ":" +
        String(minute).padStart(2, "0") +
        " " +
        ampm;

      const option =
        document.createElement("option");

      option.value = value;
      option.textContent = label;

      timeSelect.appendChild(option);
    }


    /* ==================================================
       READ CONVERSATION LOG
       ================================================== */

    let choiceLog = [];

    try {

      const storedLog =
        localStorage.getItem(
          "conversation_choice_log"
        );

      if (storedLog) {

        const parsed =
          JSON.parse(storedLog);

        if (Array.isArray(parsed)) {
          choiceLog = parsed;
        }

      }

    } catch (error) {

      console.error(
        "Could not read conversation choice log:",
        error
      );

      choiceLog = [];

    }


    /* ==================================================
       CHECK WHETHER A CHOICE EXISTS
       ================================================== */

    function hasChoice(actionName) {

      return choiceLog.some(
        function(item) {

          return item &&
                 item.action === actionName;

        }
      );

    }


    /* ==================================================
       PREPARE HIDDEN FIELDS
       ================================================== */

    function prepareHiddenFields() {

      const firstChoice =
        document.getElementById(
          "firstChoice"
        );

      const secondChoice =
        document.getElementById(
          "secondChoice"
        );

      const choiceLogField =
        document.getElementById(
          "choiceLog"
        );

      const timestampField =
        document.getElementById(
          "timestamp"
        );


      /* -----------------------------
         FIRST QUESTION
         ----------------------------- */

      if (hasChoice("first_yes")) {

        firstChoice.value = "Yes";

      } else if (hasChoice("first_no")) {

        firstChoice.value = "No";

      } else {

        firstChoice.value = "";

      }


      /* -----------------------------
         SECOND QUESTION
         ----------------------------- */

      if (hasChoice("second_yes")) {

        secondChoice.value = "Yes";

      } else if (hasChoice("second_no")) {

        secondChoice.value = "No";

      } else {

        secondChoice.value = "";

      }


      /* -----------------------------
         FULL CHOICE LOG
         ----------------------------- */

      choiceLogField.value =
        JSON.stringify(choiceLog);


      /* -----------------------------
         TIMESTAMP
         ----------------------------- */

      timestampField.value =
        new Date().toISOString();

    }


    /* ==================================================
       INITIALIZE FORM DATA
       ================================================== */

    prepareHiddenFields();


    /* ==================================================
       FIND THE SONG

       First try:
         audio/bad.mp3

       If that fails, try:
         bad.mp3
       ================================================== */

    const audioSources = [
      "./audio/bad.mp3",
      "./bad.mp3"
    ];

    let currentAudioSource = 0;


    function loadNextAudioSource() {

      if (
        currentAudioSource >=
        audioSources.length
      ) {

        console.error(
          "Could not find bad.mp3"
        );

        return;

      }


      const source =
        audioSources[currentAudioSource];


      dateSong.src = source;

      dateSong.load();

    }


    dateSong.addEventListener(
      "error",
      function() {

        currentAudioSource++;

        loadNextAudioSource();

      }
    );


    loadNextAudioSource();


    /* ==================================================
       PLAY SONG FROM 0:00
       ================================================== */

    function playSongFromBeginning() {

      try {

        dateSong.pause();

        /*
          Always reset to the beginning.
        */

        dateSong.currentTime = 0;

        dateSong.volume = 0.9;


        const playPromise =
          dateSong.play();


        if (
          playPromise &&
          typeof playPromise.catch === "function"
        ) {

          playPromise.catch(
            function(error) {

              /*
                This usually means the browser's
                autoplay policy blocked sound.

                We don't show an error to the user
                because Google Sheets submission
                must remain completely independent.
              */

              console.warn(
                "Autoplay was blocked by the browser:",
                error
              );

            }
          );

        }

      } catch (error) {

        console.error(
          "Could not start song:",
          error
        );

      }

    }


    /* ==================================================
       TRY TO START MUSIC WHEN PAGE LOADS
       ================================================== */

    window.addEventListener(
      "load",
      function() {

        /*
          Give the audio element a moment to load.
        */

        setTimeout(
          function() {

            playSongFromBeginning();

          },
          100
        );

      }
    );


    /* ==================================================
       AUTOPLAY FALLBACK

       Some browsers block sound until the visitor
       interacts with the page.

       So the first interaction anywhere on the page
       will attempt to start the song.

       THIS IS NOT CONNECTED TO THE SUBMIT BUTTON.
       ================================================== */

    let userInteractionHandled = false;


    function resumeSongAfterInteraction() {

      if (userInteractionHandled) {
        return;
      }

      userInteractionHandled = true;

      /*
        Only try if the song isn't already playing.
      */

      if (dateSong.paused) {

        playSongFromBeginning();

      }

    }


    document.addEventListener(
      "pointerdown",
      resumeSongAfterInteraction,
      {
        once: true,
        passive: true
      }
    );


    document.addEventListener(
      "keydown",
      resumeSongAfterInteraction,
      {
        once: true
      }
    );


    /* ==================================================
       FORM SUBMISSION
       ==================================================

       IMPORTANT:

       The button does NOT control the music.

       The button ONLY sends the form data.
       ================================================== */

    form.addEventListener(
      "submit",
      function(event) {


        /*
          Stop normal page navigation.
        */

        event.preventDefault();


        /*
          Validate date and time.
        */

        if (!form.checkValidity()) {

          form.reportValidity();

          return;

        }


        /*
          Prepare the latest data.
        */

        prepareHiddenFields();


        /*
          Update UI.
        */

        status.textContent =
          "Saving your date... ♥";

        submitButton.value =
          "Saving... ♥";

        submitButton.disabled =
          true;


        /*
          ==================================================
          NATIVE FORM SUBMISSION
          ==================================================

          This sends:

          first_choice
          second_choice
          date
          time
          place
          choice_log
          timestamp

          directly to Apps Script.

          The hidden iframe means the current page
          remains open.
        */

        HTMLFormElement.prototype.submit.call(
          form
        );


        /*
          Update the message after the POST has
          been initiated.
        */

        setTimeout(
          function() {

            status.textContent =
              "It's a date. ♥🙂";

            submitButton.value =
              "Date set! ♥";

          },
          1000
        );

      }
    );


  </script>


</body>

</html>
