<!-- =====================================================

<main class="card transition-page">

  <p class="meetup">

  <!-- ===================================================
       SCHEDULE FORM
       =================================================== -->

  <form
    id="scheduleForm"
    action="https://script.google.com/macros/s/AKfycbxPEWcKfJzzWcIjgLwYVkNrt8DXCKx-jZE86_rFMmVnMxZHHQjuj5ia3RoiC5pNw0T5/exec"

      type="hidden"

    <input

    <!-- DATE -->

    </label>

    <input
      id="date"
      name="date"

      required
    >


    <!-- TIME -->

    <label for="time">

    <select

      <option value="08:00">8:00 AM</option>

      <option value="09:30">9:30 AM</option>

      <option value="10:00">10:00 AM</option>
      <option value="10:15">10:15 AM</option>
      <option value="10:30">10:30 AM</option>

    <!-- SUBMIT -->

      type="submit"
      value="Set the date! 🙂"
    >

  <p
    id="status"
    class="status"
    aria-live="polite"
  ></p>

</main>


<script>

/* =====================================================
   LOAD PREVIOUS CHOICES
   ===================================================== */

const choiceLog =
  JSON.parse(
    localStorage.getItem(
      "conversation_choice_log"
    ) || "[]"
  );


/* =====================================================
   BAD BUNNY AUDIO
   ===================================================== */

const dateSong =
  document.getElementById(
    "dateSong"
  );

dateSong.volume =
  0.9;


/*
  Ask the browser to start loading the MP3
  as soon as the page opens.
*/
dateSong.load();


/* =====================================================
   CHOICE HELPERS
   ===================================================== */

function getChoice(actionName) {

  return choiceLog.some(
    item =>
      item.action === actionName
  );

}


/* =====================================================
   HIDDEN FORM VALUES
   ===================================================== */

document.getElementById(
  "firstChoice"
).value =
  getChoice("first_yes")
    ? "Yes"
    : (
        getChoice("first_no")
          ? "No"
          : ""
      );


document.getElementById(
  "secondChoice"
).value =
  getChoice("second_yes")
    ? "Yes"
    : (
        getChoice("second_no")
          ? "No"
          : ""
      );


document.getElementById(
  "choiceLog"
).value =
  JSON.stringify(
    choiceLog
  );


document.getElementById(
  "timestamp"
).value =
  new Date().toISOString();


/* =====================================================
   WAIT UNTIL AUDIO METADATA EXISTS
   ===================================================== */

function waitForAudioMetadata(audio) {

  return new Promise(
    function (resolve, reject) {

      /*
        Already loaded.
      */
      if (
        audio.readyState >= 1
      ) {

        resolve();

        return;

      }


      function onReady() {

        cleanup();

        resolve();

      }


      function onError() {

        cleanup();

        reject(
          new Error(
            "Bad Bunny audio failed to load."
          )
        );

      }


      function cleanup() {

        audio.removeEventListener(
          "loadedmetadata",
          onReady
        );

        audio.removeEventListener(
          "error",
          onError
        );

      }


      audio.addEventListener(
        "loadedmetadata",
        onReady
      );

      audio.addEventListener(
        "error",
        onError
      );

    }
  );

}


/* =====================================================
   PLAY SONG FROM 00:32
   ===================================================== */

async function playDateSong() {

  try {

    /*
      Make absolutely sure the browser knows
      the duration / timeline of the MP3 first.
    */
    await waitForAudioMetadata(
      dateSong
    );


    /*
      Stop anything currently playing.
    */
    dateSong.pause();


    /*
      Jump to exactly 32 seconds.
    */
    dateSong.currentTime =
      32;


    /*
      Keep the requested volume.
    */
    dateSong.volume =
      0.9;


    /*
      This play() happens directly as part of
      the user's submit interaction.
    */
    await dateSong.play();


    console.log(
      "Bad Bunny started at 00:32."
    );

  }

  catch (error) {

    console.error(
      "Bad Bunny audio could not play:",
      error
    );

  }

}


/* =====================================================
   FORM SUBMISSION
   ===================================================== */

document
  .getElementById(
    "scheduleForm"
  )
  .addEventListener(
    "submit",
    async function (event) {

      /*
        Prevent the browser from navigating away.
      */
      event.preventDefault();


      const form =
        document.getElementById(
          "scheduleForm"
        );


      const status =
        document.getElementById(
          "status"
        );


      const submitButton =
        form.querySelector(
          'input[type="submit"]'
        );


      /* -----------------------------------------------
         START MUSIC
         ----------------------------------------------- */

      await playDateSong();


      /* -----------------------------------------------
         UPDATE UI
         ----------------------------------------------- */

      status.textContent =
        "Saving your date... ♥";

      submitButton.value =
        "Saving... ♥";

      submitButton.disabled =
        true;


      /* -----------------------------------------------
         SEND TO GOOGLE SHEETS
         ----------------------------------------------- */

      try {

        await fetch(
          form.action,
          {
            method:
              "POST",

            mode:
              "no-cors",

            body:
              new URLSearchParams(
                new FormData(
                  form
                )
              ),

            keepalive:
              true
          }
        );


        /*
          Fetch succeeded.
        */
        status.textContent =
          "It's a date. ♥🙂";

        submitButton.value =
          "Date set! ♥";

      }

      catch (error) {

        /*
          The page still shows success because
          no-cors prevents us from reading the
          Apps Script response anyway.
        */
        console.error(
          "Date submission failed:",
          error
        );

        status.textContent =
          "It's a date. ♥🙂";

        submitButton.value =
          "Date set! ♥";

      }

    }
  );

</script>

</body>
</html>
