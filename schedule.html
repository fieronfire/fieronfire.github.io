<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>So... when are you free?</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<audio id="dateSong" preload="auto" playsinline>
  <source src="./bad.mp3" type="audio/mpeg">
</audio>

<span class="spark s1"></span>
<span class="spark s2"></span>
<span class="spark s3"></span>
<span class="spark s4"></span>
<span class="spark s5"></span>
<span class="spark s6"></span>
<span class="spark s7"></span>
<span class="spark s8"></span>
<span class="spark s9"></span>
<span class="spark s10"></span>
<span class="spark s11"></span>
<span class="spark s12"></span>
<span class="spark s13"></span>
<span class="spark s14"></span>
<span class="spark s15"></span>
<span class="spark s16"></span>
<span class="spark s17"></span>
<span class="spark s18"></span>


<main class="card transition-page">

  <div class="icon">
    📅🙂
  </div>

  <p class="eyebrow">
    Your call
  </p>

  <h1>
    So... when are you free? 🙂
  </h1>

  <p>
    Pick whatever works for you. 👍
  </p>

  <p class="meetup">
    <span>
      📍 Meet up in CCD
    </span>
  </p>


  <form
    id="scheduleForm"
    action="https://script.google.com/macros/s/AKfycbw-sdcDhrgUU0HNzFHpIhh6ylwt6ETy5D_y4J0iWmXOrVBKnoqeeenhJbI-KpSSsc1A/exec"
    method="POST"
  >

    <input
      type="hidden"
      id="firstChoice"
      name="first_choice"
    >

    <input
      type="hidden"
      id="secondChoice"
      name="second_choice"
    >

    <input
      type="hidden"
      id="place"
      name="place"
      value="CCD"
    >

    <input
      type="hidden"
      id="choiceLog"
      name="choice_log"
    >

    <input
      type="hidden"
      id="timestamp"
      name="timestamp"
    >


    <label for="date">
      Pick a Day 🙂
    </label>

    <input
      id="date"
      name="date"
      type="date"
      required
    >


    <label for="time">
      What Time? 🕒
    </label>

    <select
      id="time"
      name="time"
      required
    >

      <option
        value=""
        selected
        disabled
      >
        Select a time...
      </option>

      <option value="08:00">8:00 AM</option>
      <option value="08:15">8:15 AM</option>
      <option value="08:30">8:30 AM</option>
      <option value="08:45">8:45 AM</option>

      <option value="09:00">9:00 AM</option>
      <option value="09:15">9:15 AM</option>
      <option value="09:30">9:30 AM</option>
      <option value="09:45">9:45 AM</option>

      <option value="10:00">10:00 AM</option>
      <option value="10:15">10:15 AM</option>
      <option value="10:30">10:30 AM</option>
      <option value="10:45">10:45 AM</option>

      <option value="11:00">11:00 AM</option>
      <option value="11:15">11:15 AM</option>
      <option value="11:30">11:30 AM</option>
      <option value="11:45">11:45 AM</option>

      <option value="12:00">12:00 PM</option>
      <option value="12:15">12:15 PM</option>
      <option value="12:30">12:30 PM</option>
      <option value="12:45">12:45 PM</option>

      <option value="13:00">1:00 PM</option>
      <option value="13:15">1:15 PM</option>
      <option value="13:30">1:30 PM</option>
      <option value="13:45">1:45 PM</option>

      <option value="14:00">2:00 PM</option>
      <option value="14:15">2:15 PM</option>
      <option value="14:30">2:30 PM</option>
      <option value="14:45">2:45 PM</option>

      <option value="15:00">3:00 PM</option>
      <option value="15:15">3:15 PM</option>
      <option value="15:30">3:30 PM</option>
      <option value="15:45">3:45 PM</option>

      <option value="16:00">4:00 PM</option>
      <option value="16:15">4:15 PM</option>
      <option value="16:30">4:30 PM</option>
      <option value="16:45">4:45 PM</option>

      <option value="17:00">5:00 PM</option>
      <option value="17:15">5:15 PM</option>
      <option value="17:30">5:30 PM</option>
      <option value="17:45">5:45 PM</option>

      <option value="18:00">6:00 PM</option>
      <option value="18:15">6:15 PM</option>
      <option value="18:30">6:30 PM</option>
      <option value="18:45">6:45 PM</option>

      <option value="19:00">7:00 PM</option>
      <option value="19:15">7:15 PM</option>
      <option value="19:30">7:30 PM</option>
      <option value="19:45">7:45 PM</option>

      <option value="20:00">8:00 PM</option>
      <option value="20:15">8:15 PM</option>
      <option value="20:30">8:30 PM</option>
      <option value="20:45">8:45 PM</option>

      <option value="21:00">9:00 PM</option>
      <option value="21:15">9:15 PM</option>
      <option value="21:30">9:30 PM</option>
      <option value="21:45">9:45 PM</option>

      <option value="22:00">10:00 PM</option>
      <option value="22:15">10:15 PM</option>
      <option value="22:30">10:30 PM</option>
      <option value="22:45">10:45 PM</option>

      <option value="23:00">11:00 PM</option>
      <option value="23:15">11:15 PM</option>
      <option value="23:30">11:30 PM</option>
      <option value="23:45">11:45 PM</option>

    </select>


    <input
      id="setDateButton"
      type="submit"
      value="Set the date! 🙂"
    >

  </form>


  <p
    id="status"
    class="status"
    aria-live="polite"
  ></p>

</main>


<script>

/* =========================================================
   DATA
   ========================================================= */

const ENDPOINT_URL =
  "https://script.google.com/macros/s/AKfycbw-sdcDhrgUU0HNzFHpIhh6ylwt6ETy5D_y4J0iWmXOrVBKnoqeeenhJbI-KpSSsc1A/exec";


const choiceLog =
  JSON.parse(
    localStorage.getItem(
      "conversation_choice_log"
    ) || "[]"
  );


/* =========================================================
   ELEMENTS
   ========================================================= */

const form =
  document.getElementById(
    "scheduleForm"
  );

const dateSong =
  document.getElementById(
    "dateSong"
  );

const submitButton =
  document.getElementById(
    "setDateButton"
  );

const status =
  document.getElementById(
    "status"
  );


/* =========================================================
   CHOICE HELPER
   ========================================================= */

function getChoice(actionName) {

  return choiceLog.some(
    item =>
      item.action === actionName
  );

}


/* =========================================================
   FILL HIDDEN VALUES
   ========================================================= */

document.getElementById(
  "firstChoice"
).value =
  getChoice("first_yes")
    ? "Yes"
    : (
        getChoice("first_no")
          ? "No"
          : ""
      );


document.getElementById(
  "secondChoice"
).value =
  getChoice("second_yes")
    ? "Yes"
    : (
        getChoice("second_no")
          ? "No"
          : ""
      );


document.getElementById(
  "choiceLog"
).value =
  JSON.stringify(
    choiceLog
  );


document.getElementById(
  "timestamp"
).value =
  new Date().toISOString();


/* =========================================================
   PLAY BAD BUNNY
   ========================================================= */

function playDateSong() {

  try {

    dateSong.pause();

    dateSong.currentTime =
      0;

    dateSong.volume =
      0.9;

    const playPromise =
      dateSong.play();


    if (
      playPromise &&
      typeof playPromise.catch ===
        "function"
    ) {

      playPromise.catch(
        function (error) {

          console.warn(
            "Bad Bunny playback failed:",
            error
          );

        }
      );

    }

  }

  catch (error) {

    console.warn(
      "Bad Bunny audio error:",
      error
    );

  }

}


/* =========================================================
   DIRECT CLICK
   =========================================================
   
   This fires directly from the user's click.
   It does NOT wait for anything.
   ========================================================= */

submitButton.addEventListener(
  "click",
  function () {

    playDateSong();

  }
);


/* =========================================================
   FORM SUBMISSION
   ========================================================= */

form.addEventListener(
  "submit",
  function (event) {

    event.preventDefault();


    /*
      Check date/time before sending.
    */
    if (
      !form.checkValidity()
    ) {

      form.reportValidity();

      return;

    }


    /*
      Start the song again.
      The click handler above already attempts
      playback, so this is just a second safe call.
    */
    playDateSong();


    /*
      Update UI immediately.
    */
    status.textContent =
      "Saving your date... ♥";

    submitButton.value =
      "Saving... ♥";

    submitButton.disabled =
      true;


    /*
      Build the form payload.
    */
    const formData =
      new FormData(
        form
      );

    const payload =
      new URLSearchParams(
        formData
      );


    /*
      Send to Google Apps Script.

      We do NOT await this before updating
      the page, so nothing can make the button
      appear frozen.
    */
    fetch(
      ENDPOINT_URL,
      {
        method:
          "POST",

        mode:
          "no-cors",

        headers: {
          "Content-Type":
            "application/x-www-form-urlencoded;charset=UTF-8"
        },

        body:
          payload,

        keepalive:
          true
      }
    )
    .then(
      function () {

        status.textContent =
          "It's a date. ♥🙂";

        submitButton.value =
          "Date set! ♥";

      }
    )
    .catch(
      function (error) {

        console.error(
          "Date submission failed:",
          error
        );

        /*
          Keep the UI positive because
          no-cors does not expose the Apps Script
          response to the browser.
        */
        status.textContent =
          "It's a date. ♥🙂";

        submitButton.value =
          "Date set! ♥";

      }
    );

  }
);

</script>

</body>
</html>
