  <!-- ==================================================
       JAVASCRIPT
       ================================================== -->

  <script>


    /*
      ==================================================
      LOAD SAVED CHOICE LOG
      ==================================================
    */

    let choiceLog = [];


    try {

      choiceLog = JSON.parse(
        localStorage.getItem(
          "conversation_choice_log"
        ) || "[]"
      );


      if (!Array.isArray(choiceLog)) {

        choiceLog = [];

      }

    } catch (error) {

      console.error(
        "Could not read choice log:",
        error
      );

      choiceLog = [];

    }



    /*
      ==================================================
      GET ELEMENTS
      ==================================================
    */

    const form =
      document.getElementById(
        "scheduleForm"
      );


    const dateSong =
      document.getElementById(
        "dateSong"
      );


    const submitButton =
      document.getElementById(
        "setDateButton"
      );


    const status =
      document.getElementById(
        "status"
      );



    /*
      ==================================================
      CHECK WHETHER A CHOICE EXISTS
      ==================================================
    */

    function getChoice(actionName) {

      return choiceLog.some(
        function(item) {

          return item.action === actionName;

        }
      );

    }



    /*
      ==================================================
      PREPARE FIRST CHOICE
      ==================================================
    */

    function updateFirstChoice() {

      const firstChoice =
        document.getElementById(
          "firstChoice"
        );


      if (getChoice("first_yes")) {

        firstChoice.value = "Yes";

      } else if (getChoice("first_no")) {

        firstChoice.value = "No";

      } else {

        firstChoice.value = "";

      }

    }



    /*
      ==================================================
      PREPARE SECOND CHOICE
      ==================================================
    */

    function updateSecondChoice() {

      const secondChoice =
        document.getElementById(
          "secondChoice"
        );


      if (getChoice("second_yes")) {

        secondChoice.value = "Yes";

      } else if (getChoice("second_no")) {

        secondChoice.value = "No";

      } else {

        secondChoice.value = "";

      }

    }



    /*
      ==================================================
      PREPARE CHOICE LOG
      ==================================================
    */

    function updateChoiceLog() {

      document.getElementById(
        "choiceLog"
      ).value =
        JSON.stringify(choiceLog);

    }



    /*
      ==================================================
      PREPARE TIMESTAMP
      ==================================================
    */

    function updateTimestamp() {

      document.getElementById(
        "timestamp"
      ).value =
        new Date().toISOString();

    }



    /*
      ==================================================
      INITIALIZE EVERYTHING
      ==================================================
    */

    updateFirstChoice();

    updateSecondChoice();

    updateChoiceLog();

    updateTimestamp();



    /*
      ==================================================
      PLAY SONG
      ==================================================

      IMPORTANT:

      The song is ALWAYS reset to 0:00.

      This function does not wait for anything.
      It is called directly from the button click.
    */

    function startSong() {

      try {

        dateSong.pause();


        /*
          Start from the absolute beginning.
        */

        dateSong.currentTime = 0;


        /*
          Set volume.
        */

        dateSong.volume = 0.9;


        /*
          Play immediately.
        */

        const playPromise =
          dateSong.play();


        /*
          Catch browser/audio errors without
          affecting Google Sheet submission.
        */

        if (
          playPromise &&
          typeof playPromise.catch === "function"
        ) {

          playPromise.catch(
            function(error) {

              console.error(
                "Bad Bunny playback error:",
                error
              );

            }
          );

        }

      } catch (error) {

        console.error(
          "Could not start Bad Bunny:",
          error
        );

      }

    }



    /*
      ==================================================
      PLAY MUSIC DIRECTLY ON BUTTON CLICK
      ==================================================

      This is deliberately separate from form
      submission so the browser sees the music
      as a direct consequence of the user's click.
    */

    submitButton.addEventListener(
      "click",
      function() {

        if (!form.checkValidity()) {

          return;

        }


        startSong();

      }
    );



    /*
      ==================================================
      SUBMIT FORM TO GOOGLE SHEETS
      ==================================================
    */

    form.addEventListener(
      "submit",
      function(event) {


        /*
          Stop the browser from navigating away.
        */

        event.preventDefault();



        /*
          Check required fields.
        */

        if (!form.checkValidity()) {

          form.reportValidity();

          return;

        }



        /*
          Refresh all hidden data immediately
          before sending it.
        */

        updateFirstChoice();

        updateSecondChoice();

        updateChoiceLog();

        updateTimestamp();



        /*
          Update page status.
        */

        status.textContent =
          "Saving your date... ♥";


        submitButton.value =
          "Saving... ♥";


        submitButton.disabled =
          true;



        /*
          ==================================================
          REAL NATIVE FORM SUBMISSION
          ==================================================

          This bypasses our submit listener and sends
          the form normally to Google Apps Script.

          The target is the hidden iframe, so the
          current page stays open.
        */

        HTMLFormElement.prototype.submit.call(
          form
        );



        /*
          Let the user know that the date was submitted.
        */

        setTimeout(
          function() {

            status.textContent =
              "It's a date. ♥🙂";


            submitButton.value =
              "Date set! ♥";

          },
          1000
        );


      }
    );


  </script>
